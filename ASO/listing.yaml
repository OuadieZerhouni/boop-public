    description: |-
      Fais boop sur le museau !

      Boop! est le plus petit et le plus joyeux des jeux sur ton téléphone. Touche le nez d'une petite bête toute douce et regarde-la glousser, se dandiner et rougir. Continue pour enchaîner les combos, la faire éternuer et remplir ton anneau de boops du jour.

      DOUZE PETITS AMIS À RENCONTRER
      Commence avec Mochi le lapin et rencontre de nouveaux amis au fil de tes boops : un poussin, un panda, une grenouille, un bébé hippo, un agneau-nuage, un phoque, un hamster, un chiot, une méduse, un esprit-feuille, et un bébé dragon très rare. Chaque petite bête a ses propres couleurs et son propre petit couinement.

      COMMENT JOUER
      • Touche le nez : chaque boop compte
      • Enchaîne les boops pour un Boop-a-doop, une Tempête de boops ou un MÉGA BOOP
      • Maintiens pour un câlin, glisse pour écraser tout doux
      • Atteins ton objectif du jour pour garder ta série
      • Essaie Boop Rush : 30 secondes, neuf buissons, un maximum de museaux. Mais laisse dormir les endormis !

      FAIT POUR TE FAIRE DU BIEN
      • Sans pub. Sans achats. Sans compte.
      • Fonctionne hors ligne
      • Sons doux et vibrations légères (désactivables)
      • Compatible avec Réduire les animations pour un écran plus calme
      • Disponible en Français, English, العربية, Deutsch, Español, 日本語 et Português

      La petite pause parfaite : boope dix secondes ou dix minutes, et reviens demain pour ta série.
  ja:
    name: Boop! ぷにぷに鼻タッチ
    subtitle: 癒しのかわいい動物ゲーム
    keywords: 癒し系,ペット,育成,暇つぶし,ストレス解消,もちもち,ふわふわ,コレクション,カワイイ,もふもふ,タップ,スクイーズ,癒やし,うさぎ,パンダ,ドラゴン,クラゲ,ゆるかわ,つんつん,ミニゲーム
    promotionalText: ぷにぷにの動物たち12匹があなたのブープを待っています。鼻をタップしてコンボをつなげ、毎日の連続記録をキープ。広告なし・課金なし、しあわせな小さな鼻だけ。
    privacyPolicyUrl: https://github.com/OuadieZerhouni/app-configs/blob/main/boop/PRIVACY.md
    supportUrl: https://github.com/OuadieZerhouni/app-configs/blob/main/boop/SUPPORT.md
    description: |-
      鼻をブープ！

      Boop!は、あなたのスマホでいちばん小さくて、いちばんしあわせなゲーム。ぷにぷにの動物の鼻をタップすると、くすくす笑って、ぷるぷる揺れて、ほっぺが赤くなります。ブープを続けてコンボをつなげ、くしゃみをさせて、毎日のブープリングを満たしましょう。

      なかよくなれる12匹
      はじめはうさぎのモチ。ブープが増えるたびに新しい友だちに会えます：ひよこ、パンダ、カエル、赤ちゃんカバ、くもヒツジ、アザラシ、ハムスター、子犬、クラゲ、葉っぱの妖精、そしてとてもレアな赤ちゃんドラゴン。どの子にも自分だけの色と鳴き声があります。

      あそびかた
      • 鼻をタップ：ブープはぜんぶカウント
      • ブープをつなげて「ブーパドゥー！」「ブープの嵐！」「メガブープ！」
      • 長押しでハグ、ドラッグでむにゅっと
      • 毎日の目標を達成して連続記録をキープ
      • ブープラッシュに挑戦：30秒、9つのしげみ、できるだけたくさんの鼻を。でも眠い子は寝かせてあげて！

      気持ちよく遊べるように
      • 広告なし。課金なし。アカウント不要。
      • オフラインで遊べます
      • やさしいサウンドと控えめな振動（どちらもオフにできます）
      • 「視差効果を減らす」に対応した落ち着いた画面
      • 日本語、English、العربية、Deutsch、Español、Français、Português に対応

      ちょっとした息抜きにぴったり。10秒でも10分でもブープして、明日も連続記録のために戻ってきてね。
