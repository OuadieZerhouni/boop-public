app: Boop! Squishy Snoot Pets
bundle_id: com.ouadieZerhouni.boop
version: '1.0'
version_state: PREPARE_FOR_SUBMISSION
locales:
  en-US:
    name: Boop! Squishy Snoot Pets
    subtitle: Cute Kawaii Animal Tap Game
    keywords: satisfying,antistress,relaxing,games,fidget,stress,relief,calm,cozy,nose,critter,collect,adorable
    promotionalText: Twelve squishy critters are waiting for a boop. Tap the snoot, chain combos, keep your daily streak. No ads, no purchases, just happy little noses.
    privacyPolicyUrl: https://github.com/OuadieZerhouni/app-configs/blob/main/boop/PRIVACY.md
    supportUrl: https://github.com/OuadieZerhouni/app-configs/blob/main/boop/SUPPORT.md
    description: |-
      Boop the snoot!

      Boop! is the tiniest, happiest game on your phone. Tap a squishy little critter right on the nose and watch it giggle, wobble and blush. Keep booping to build combos, make it sneeze, and fill your daily boop ring.

      TWELVE CRITTERS TO BEFRIEND
      Start with Mochi the bunny and unlock new friends as your boops add up: a chick, a panda, a frog, a baby hippo, a cloud lamb, a seal, a hamster, a puppy, a jellyfish, a leaf sprite, and one very rare baby dragon. Every critter has its own colours and its own little squeak.

      HOW TO PLAY
      • Boop the nose: every boop counts
      • Chain boops for a Boop-a-doop, a Snoot Storm or a MEGA BOOP
      • Hold to give a hug, drag to squish
      • Hit your daily goal to keep your streak going
      • Try Boop Rush: 30 seconds, nine bushes, as many snoots as you can. But let the sleepy ones nap!

      MADE TO FEEL GOOD
      • No ads. No purchases. No account.
      • Works offline
      • Soft sounds and gentle haptics (both can be switched off)
      • Reduce Motion support for a calmer screen
      • Available in English, العربية, Deutsch, Español, Français, 日本語 and Português

      A perfect little break: boop for ten seconds or ten minutes, and come back tomorrow for your streak.
