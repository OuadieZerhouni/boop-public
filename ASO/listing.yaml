      Comece com a Mochi, a coelhinha, e conheça novos amigos conforme seus boops aumentam: um pintinho, um panda, um sapo, um hipopótamo bebê, uma ovelhinha de nuvem, uma foca, um hamster, um filhote de cachorro, uma água-viva, um espírito de folha e um dragão bebê muito raro. Cada bichinho tem suas próprias cores e seu próprio guinchinho.

