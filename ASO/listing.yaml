  ar-SA:
    name: Boop! حيوانات كيوت
    subtitle: لعبة حيوانات لطيفة للتسلية
    # ASO.md had "كيوت" here too; the name already carries it, so it was a wasted repeat.
    keywords: بوب,العاب,استرخاء,توتر,ضغط,ناعم,دبدوب,باندا,ارنب,تنين,جمع,هادئة,مريحة,فيدجت,squishy,kawaii
    promotionalText: اثنا عشر حيوانًا لطيفًا بانتظار لمستك. المس الأنف الصغير، اصنع كومبو، وحافظ على سلسلتك اليومية. بلا إعلانات ولا مشتريات، فقط أنوف صغيرة سعيدة.
    privacyPolicyUrl: https://github.com/OuadieZerhouni/app-configs/blob/main/boop/PRIVACY.md
    supportUrl: https://github.com/OuadieZerhouni/app-configs/blob/main/boop/SUPPORT.md
    description: |-
      المس الأنف الصغير!

      Boop! هي أصغر وأسعد لعبة على هاتفك. المس أنف حيوان صغير وطري وشاهده يضحك ويتمايل ويحمرّ خجلًا. واصل اللمس لتصنع كومبو، واجعله يعطس، واملأ حلقة البوب اليومية.

      اثنا عشر صديقًا بانتظارك
      ابدأ مع موتشي الأرنب، وتعرّف على أصدقاء جدد كلما زادت بوباتك: كتكوت، وباندا، وضفدع، وفرس نهر صغير، وخروف من الغيم، وفقمة، وهامستر، وجرو، وقنديل بحر، وروح ورقة شجر، وتنين صغير نادر جدًا. لكل صديق ألوانه الخاصة وصوته الصغير الخاص.

      طريقة اللعب
      • المس الأنف: كل بوب يُحتسب
      • اصنع سلسلة لمسات لتحصل على «بوب-آ-دوب!» و«عاصفة البوب!» و«بوب خارق!»
      • اضغط مطولًا لتعانقه، واسحب لتعصره
      • حقق هدفك اليومي لتحافظ على سلسلتك
      • جرّب «سباق البوب»: ٣٠ ثانية، تسع شجيرات، وأكبر عدد ممكن من الأنوف. لكن دع النعسانين ينامون!

      صُممت لتشعرك بالراحة
      • بلا إعلانات. بلا مشتريات. بلا حساب.
      • تعمل دون اتصال بالإنترنت
      • أصوات ناعمة واهتزاز لطيف (يمكن إيقاف الاثنين)
      • دعم «تقليل الحركة» لشاشة أهدأ
      • متوفرة بالعربية، English، Deutsch، Español، Français، 日本語 وPortuguês

      استراحة صغيرة مثالية: المس لعشر ثوانٍ أو لعشر دقائق، وعُد غدًا لتحافظ على سلسلتك.
  de-DE:
    name: Boop! Süße Knuddel-Tiere
    subtitle: Kawaii Tierspiel zum Antippen
    keywords: spiele,entspannung,antistress,stress,niedlich,haustier,virtuell,sammeln,fidget,nase,squishy,cute
    promotionalText: Zwölf knuddelige Tierchen warten auf einen Stupser. Tippe auf die Nase, verkette Combos, halte deine Tagesserie. Keine Werbung, keine Käufe, nur fröhliche kleine Nasen.
    privacyPolicyUrl: https://github.com/OuadieZerhouni/app-configs/blob/main/boop/PRIVACY.md
    supportUrl: https://github.com/OuadieZerhouni/app-configs/blob/main/boop/SUPPORT.md
    description: |-
      Stups die Nase!

      Boop! ist das kleinste, fröhlichste Spiel auf deinem Handy. Tippe einem knuddeligen Tierchen direkt auf die Nase und sieh zu, wie es kichert, wackelt und rot wird. Stups weiter, um Combos aufzubauen, es zum Niesen zu bringen und deinen täglichen Boop-Ring zu füllen.

      ZWÖLF TIERCHEN ZUM ANFREUNDEN
      Du startest mit Mochi, dem Häschen, und triffst neue Freunde, je mehr Boops du sammelst: ein Küken, einen Panda, einen Frosch, ein Baby-Nilpferd, ein Wolkenlamm, eine Robbe, einen Hamster, einen Welpen, eine Qualle, einen Blattgeist und einen ganz seltenen Babydrachen. Jedes Tierchen hat eigene Farben und sein eigenes kleines Quietschen.

      SO WIRD GESPIELT
      • Stups die Nase: Jeder Boop zählt
      • Verkette Boops zu Boop-a-doop, Stupser-Sturm oder MEGA-BOOP
      • Gedrückt halten zum Knuddeln, ziehen zum Quetschen
      • Erreiche dein Tagesziel und halte deine Serie
      • Probier Boop Rush: 30 Sekunden, neun Büsche, so viele Nasen wie möglich. Aber lass die müden schlafen!

      ZUM WOHLFÜHLEN GEMACHT
      • Keine Werbung. Keine Käufe. Kein Konto.
      • Funktioniert offline
      • Sanfte Töne und dezente Vibration (beides abschaltbar)
      • Unterstützt „Bewegung reduzieren“ für einen ruhigeren Bildschirm
      • Verfügbar auf Deutsch, English, العربية, Español, Français, 日本語 und Português

      Die perfekte kleine Pause: Stups zehn Sekunden oder zehn Minuten lang und komm morgen für deine Serie wieder.
  es-MX:
    name: Boop! Mascotas Adorables
    subtitle: Juego kawaii de animalitos
    keywords: mascota,virtual,lindos,juegos,tiernos,antiestres,relajante,squishy,fidget,nariz,coleccion,animales
    promotionalText: Doce animalitos blanditos esperan un boop. Toca la naricita, encadena combos y mantén tu racha diaria. Sin anuncios ni compras, solo naricitas felices.
    privacyPolicyUrl: https://github.com/OuadieZerhouni/app-configs/blob/main/boop/PRIVACY.md
    supportUrl: https://github.com/OuadieZerhouni/app-configs/blob/main/boop/SUPPORT.md
    description: &es |-
      ¡Haz boop en la naricita!

      Boop! es el juego más pequeño y feliz de tu teléfono. Toca la nariz de un animalito blandito y míralo reír, tambalearse y sonrojarse. Sigue haciendo boop para encadenar combos, hacerlo estornudar y llenar tu anillo diario de boops.

      DOCE AMIGUITOS POR CONOCER
      Empieza con Mochi, la conejita, y conoce nuevos amigos a medida que sumas boops: un pollito, un panda, una rana, un hipopótamo bebé, una ovejita de nube, una foca, un hámster, un cachorrito, una medusa, un espíritu de hoja y un dragón bebé muy raro. Cada animalito tiene sus propios colores y su propio chillido.

      CÓMO SE JUEGA
      • Toca la nariz: cada boop cuenta
      • Encadena boops para un Boop-a-doop, una Tormenta de boops o un MEGA BOOP
      • Mantén pulsado para abrazar, arrastra para apachurrar
      • Cumple tu meta diaria para mantener tu racha
      • Prueba Boop Rush: 30 segundos, nueve arbustos y todas las naricitas que puedas. ¡Pero deja dormir a los dormilones!

      HECHO PARA SENTIRTE BIEN
      • Sin anuncios. Sin compras. Sin cuenta.
      • Funciona sin conexión
      • Sonidos suaves y vibración delicada (ambos se pueden desactivar)
      • Compatible con Reducir movimiento para una pantalla más tranquila
      • Disponible en Español, English, العربية, Deutsch, Français, 日本語 y Português

      Un descanso perfecto: haz boop diez segundos o diez minutos, y vuelve mañana por tu racha.
